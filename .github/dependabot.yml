version: 2
updates:
# GitHub Actions
- package-ecosystem: github-actions
  directory: .github/workflows
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 1
  labels:
  - maintenance 🔧

# uv
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 3
    semver-major-days: 7
  labels:
  - maintenance 🔧
  groups:
    core:
      patterns:
      - alembic
      - fastapi
      - loguru
      - pluggy
      - screenplay-tools
      - sqlmodel
    gui:
      patterns:
        - nicegui
        - sqladmin
    dev:
      patterns:
      - black
      - pytest*
      - ruff
      - typer
      - uv
    docs:
      patterns:
      - zensical
    utilities:
      patterns:
      - fpdf2
