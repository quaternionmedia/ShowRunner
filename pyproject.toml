[project]
name = "showrunner"
version = "0.2.0"
description = "A collection of tools for live performances including script parsing, cue management, and more."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135.2",
    "loguru>=0.7.3",
    "httpx>=0.27",
    "nicegui>=2.0",
    "pluggy>=1.6.0",
    "screenplay-tools>=0.0.10",
    "sqlmodel>=0.0.37",
    "watchfiles>=1.0.0",
]

[project.scripts]
sr = "showrunner.cli:cli"

[project.optional-dependencies]
admin = ["sqladmin>=0.20.1", "sqlalchemy[asyncio]>=2.0.54"]
cli = ["typer>=0.24.1"]
# python-rtmidi ships no wheel for CPython 3.13 on Windows and its sdist needs
# a meson toolchain, so the extra is skipped there: ShowMidi imports rtmidi
# optionally and reports "rtmidi not installed" on its routes when it is absent.
midi = ["python-rtmidi>=1.5; python_version < '3.13'"]
pdf = ["fpdf2>=2.8.7"]
all = ["showrunner[admin]", "showrunner[cli]", "showrunner[midi]", "showrunner[pdf]"]

[dependency-groups]
dev = ["black>=26.3.1", "pytest>=9.0.2", "pytest-asyncio>=1.0", "ruff>=0.15.8", "uvicorn>=0.42.0"]
docs = ["zensical>=0.0.31"]
# NiceGUI page tests (no browser) — install with: uv sync --group ui-test
ui-test = [
    {include-group = "dev"},
]
# Browser tests: uv sync --group e2e && uv run playwright install chromium
e2e = ["pytest-playwright>=0.7", "showrunner[cli]"]
# AV tool integrations — install with: uv sync --group av
av = [
    "simpleobsws>=1.0",    # ShowRecorder: OBS websocket v5 protocol client
    "python-osc>=1.8",     # ShowMixer + ShowProgrammer: OSC client
    "kokoro>=0.9",         # ShowVoicer: local neural TTS engine
    "soundfile>=0.12",     # ShowVoicer: WAV file output
    "numpy>=1.24",         # ShowVoicer: audio array concatenation
]

[tool.uv]
# e2e is a default group: walkthrough/03 runs in `uv run pytest` and needs Playwright.
default-groups = ["dev", "e2e"]

[tool.pytest.ini_options]
# The walkthrough's pages are doctests: `uv run pytest` runs them with the tests,
# and CI names both paths (testpaths is ignored once pytest is given one).
testpaths = ["tests", "walkthrough"]
pythonpath = ["."]
# tests/e2e drives a real browser and runs on its own: uv run pytest tests/e2e
# (Playwright's sync API holds an event loop that the async page tests then can't start.)
norecursedirs = ["tests/e2e"]
addopts = "-v --tb=short --doctest-glob=*.md"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "ui: NiceGUI page-level tests (no browser, uses user_simulation)",
    "e2e: full-browser Playwright end-to-end tests (requires live server)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Plugins are loaded in dependency order (DB before Admin/Dashboard), not alphabetically.
"src/showrunner/plugins/__init__.py" = ["I001"]
# Inline JS strings in the scripter UI are intentionally long.
"src/showrunner/plugins/scripter.py" = ["E501"]
# Example scripts contain long cue notes data literals — readability over line length.
"examples/*.py" = ["E501"]

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"
